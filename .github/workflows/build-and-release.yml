name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Store Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Run lint & type checking
        run: |
          uv run ruff check .
          uv run mypy src

      - name: Run test suite
        run: uv run pytest

      - name: Build package distribution (wheel & sdist)
        run: uv build

      - name: Store package in GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parisbibpy-dist
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Publishing tagged release for ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }}" \
              --generate-notes
          else
            echo "Updating rolling latest release for main branch..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f latest
            git push -f origin latest
            gh release delete latest --yes || true
            gh release create latest dist/* \
              --title "Latest Build (main branch)" \
              --notes "Automated package build from commit \`${{ github.sha }}\` on \`main\` branch." \
              --prerelease
          fi
